lang: "en"

chatFormat:
  general: "&7{displayName}&7: &r{message}"
  staffChat: "[StaffChat] &7{displayName}&7: &r{message}"

ignoreFormat: "&7This is a message you have decided to ignore."
floodFormat: "Your message contains a flood. It was automatically deleted."
spamFormat: "Your message contains too many uppercase letters. It has been automatically written in lower case."

# Cancels a message repeating the same character. Bypass: fmessage.bypass.flood
antiFlood:
  enabled: true
  # Number of identical consecutive characters that trigger the check.
  charRepeat: 7

# Lowercases a message shouted in capitals. Bypass: fmessage.bypass.spam
antiCaps:
  enabled: true
  # Messages shorter than this are never checked.
  minLength: 3
  # Uppercase / lowercase ratio above which the message is lowercased.
  ratio: 1.0
